name: ci

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  # release.yml calls this workflow instead of restating a subset of it. The
  # gate a tag has to pass is then the gate a branch has to pass, by
  # construction — a job added here cannot be forgotten there.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.0"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      # tests/preload.ts keeps the suite out of ~/.cortex and out of HOME
      # entirely; what it may not do is re-fetch the grammar from GitHub on
      # every run, so that one download lives in a cache of the suite's own.
      - name: Cache the downloaded tree-sitter grammar
        uses: actions/cache@v4
        with:
          path: /tmp/cortex-test-cache/grammars
          key: grammars-${{ runner.os }}-${{ hashFiles('src/indexer/grammar.ts') }}

      - run: bun run lint:ci

      - run: bun run typecheck

      - name: Tests — 100% line and function coverage enforced
        run: bun run test:coverage

      - name: Audit what the coverage report cannot see
        run: bun run coverage:audit

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: coverage/lcov.info
          if-no-files-found: ignore

  binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Cache the grammar, model and onnxruntime downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cortex/grammars
            ~/.cortex/models
            ~/.cortex/onnxruntime
          key: assets-${{ runner.os }}-${{ hashFiles('src/indexer/grammar.ts', 'src/embedding/model.ts', 'src/embedding/onnxruntime-assets.ts') }}

      - name: Compiled binary smoke test
        run: bun run smoke:compiled

      # Retrieval quality has no other gate: every unit test asserts ordering
      # over three-decision fixtures, so a change to the fusion weights, the
      # similarity threshold, intentTerms or the FTS tokenizer could halve
      # recall@5 over a real corpus and the whole suite would stay green. This
      # runs in the one job that already has the model. The floor sits under
      # today's 0.92 so the corpus can grow without failing the build, and far
      # above anything that would count as a regression.
      - name: Search quality — recall@5 over this repo's own decisions
        run: |
          bun src/cli/main.ts sync
          bun src/cli/main.ts embed --missing
          bun run eval:search --min-recall 0.85

      # install.sh picks the asset to download and target.ts picks the one to
      # upgrade to. They are separate implementations on purpose; this is what
      # keeps them from disagreeing about the running host.
      - name: install.sh and target.ts agree on this host
        run: |
          set -eu
          from_shell=$(CORTEX_SOURCE_ONLY=1 sh -c '. ./install.sh; detect_suffix')
          from_typescript=$(bun -e 'import { buildTarget } from "./src/release/target";
            delete process.env.CORTEX_BUILD_TARGET;
            console.log(buildTarget());')
          echo "install.sh=$from_shell target.ts=$from_typescript"
          test "$from_shell" = "$from_typescript"

  # Linux is where the suite runs; macOS and Windows get the artifact driven end
  # to end instead, because that is what a cross-compiled binary has to prove.
  # This job is inside the gate rather than after the release: install.ps1 is
  # only parsed by PowerShell, so a syntax error in it would otherwise be found
  # by verify-windows — after the tag has already published.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Cache the grammar, model and onnxruntime downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cortex/grammars
            ~/.cortex/models
            ~/.cortex/onnxruntime
          key: assets-${{ runner.os }}-${{ hashFiles('src/indexer/grammar.ts', 'src/embedding/model.ts', 'src/embedding/onnxruntime-assets.ts') }}

      - run: bun run typecheck

      - name: Compiled binary smoke test
        run: bun run smoke:compiled

      # The same agreement ci already enforces between install.sh and
      # target.ts, on the platform whose installer is a second implementation
      # of the same rule. A disagreement here is an install that upgrades
      # itself to an asset it is not.
      - name: install.ps1 and target.ts agree on this host
        shell: pwsh
        run: |
          $env:CORTEX_SOURCE_ONLY = '1'
          . ./install.ps1
          $fromShell = Get-Suffix
          $fromTypescript = bun -e 'import { buildTarget } from "./src/release/target";
            delete process.env.CORTEX_BUILD_TARGET;
            console.log(buildTarget());'
          Write-Host "install.ps1=$fromShell target.ts=$fromTypescript"
          if ($fromShell -ne $fromTypescript.Trim()) { exit 1 }
