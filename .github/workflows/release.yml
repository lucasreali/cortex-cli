name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.0"

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Assert the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(bun -e 'console.log(require("./package.json").version)')
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag != package.json $pkg" >&2
            exit 1
          fi

  # The whole of CI, not a subset of it: lint, typecheck, the 100% coverage
  # threshold, the coverage audit and the install.sh/target.ts agreement check
  # — the one thing standing between a suffix rename and an unupgradeable
  # fleet. Calling it is what keeps the two from drifting.
  gate:
    needs: tag
    uses: ./.github/workflows/ci.yml

  release:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Cache the grammar, model and onnxruntime downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cortex/grammars
            ~/.cortex/models
            ~/.cortex/onnxruntime
          key: assets-${{ runner.os }}-${{ hashFiles('src/indexer/grammar.ts', 'src/embedding/model.ts', 'src/embedding/onnxruntime-assets.ts') }}

      - run: bun scripts/package-release.ts

      # gate compiled its own binary from the same source; these are the bytes
      # that will carry the tag, so they are the ones driven end to end.
      - name: Smoke-test the bytes about to be published
        run: |
          set -eu
          published=$(mktemp -d)
          tar -xzf "dist/release/cortex-$GITHUB_REF_NAME-linux-x64.tar.gz" \
            -C "$published"
          test -f "$published/LICENSE"
          test -f "$published/THIRD-PARTY-NOTICES.md"
          CORTEX_SMOKE_BINARY="$published/cortex" bun run smoke:compiled

      # Nothing signs checksums.txt, so a consumer verifying a tarball against
      # it is trusting TLS plus this account. A provenance attestation is a
      # second, independent root: it binds these bytes to this workflow, this
      # commit and this repository, and it is verified against Sigstore rather
      # than against a file served from the same origin as the download.
      - name: Attest what this workflow built
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/release/*.tar.gz
            dist/release/checksums.txt

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/release/* --generate-notes

  verify-darwin:
    needs: release
    runs-on: macos-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@v4

      # Through install.sh rather than beside it: this job is the only place a
      # darwin install is ever executed, and a second hand-rolled download would
      # prove the release is fine while the script every user actually runs —
      # its darwin branch, its checksum verification, its version probe — stays
      # unexercised.
      - name: Install the way a user would
        env:
          CORTEX_VERSION: ${{ github.ref_name }}
          CORTEX_INSTALL_DIR: ${{ github.workspace }}/bin
        run: sh install.sh

      # The verification instruction the README gives readers, run against a
      # real release before anyone follows it. install.sh downloads into a temp
      # directory it removes on exit — deliberately, it installs a binary and
      # not an archive — so the asset is fetched again here rather than left
      # behind for this step.
      - name: Verify the published attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          asset="cortex-$GITHUB_REF_NAME-darwin-arm64.tar.gz"
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir attestation
          gh attestation verify "attestation/$asset" --repo "$GITHUB_REPOSITORY"

      - name: Run the darwin binary
        run: |
          cortex="$GITHUB_WORKSPACE/bin/cortex"
          "$cortex" --version
          "$cortex" upgrade --check --json
          repo=$(mktemp -d)
          cd "$repo"
          git init -b main
          git config user.email ci@example.com
          git config user.name CI
          git remote add origin git@github.com:acme/darwin-smoke.git
          mkdir src
          printf 'export class A { b(): boolean { return true } }\n' > src/a.ts
          git add .
          git commit -m init --no-gpg-sign
          "$cortex" init --yes
          "$cortex" index

  # The Windows mirror of verify-darwin: the asset that was just published,
  # installed by the script a user actually runs, and driven end to end on the
  # platform it was cross-compiled for.
  verify-windows:
    needs: release
    runs-on: windows-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@v4

      - name: Install the way a user would
        shell: pwsh
        env:
          CORTEX_VERSION: ${{ github.ref_name }}
          CORTEX_INSTALL_DIR: ${{ github.workspace }}\bin
        run: ./install.ps1

      - name: Verify the published attestation
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $asset = "cortex-$env:GITHUB_REF_NAME-windows-x64.tar.gz"
          gh release download $env:GITHUB_REF_NAME `
            --repo $env:GITHUB_REPOSITORY --pattern $asset --dir attestation
          gh attestation verify "attestation/$asset" --repo $env:GITHUB_REPOSITORY

      - name: Run the Windows binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cortex = "$env:GITHUB_WORKSPACE\bin\cortex.exe"
          & $cortex --version
          & $cortex upgrade --check --json
          $repo = Join-Path $env:RUNNER_TEMP 'windows-smoke'
          New-Item -ItemType Directory -Force -Path $repo | Out-Null
          Set-Location $repo
          git init -b main
          git config user.email ci@example.com
          git config user.name CI
          git remote add origin git@github.com:acme/windows-smoke.git
          New-Item -ItemType Directory -Force -Path src | Out-Null
          'export class A { b(): boolean { return true } }' | Set-Content src/a.ts
          git add .
          git commit -m init --no-gpg-sign
          & $cortex init --yes
          & $cortex index
          # The one part of the hook path no Linux job can exercise: git runs
          # these through the sh it bundles on Windows, which reads a
          # backslash as an escape.
          & $cortex install --git-hooks --yes
          # No `doctor` here, and none in verify-darwin either. A runner that
          # has never embedded has no model on disk, which doctor reports as a
          # finding and exits non-zero for — correctly. Asserting a clean
          # doctor would mean downloading 300 MB of weights to verify a
          # download this job is not testing.
