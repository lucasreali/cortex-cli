name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.3.14"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Assert the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(bun -e 'console.log(require("./package.json").version)')
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag != package.json $pkg" >&2
            exit 1
          fi

      - run: bun run typecheck

      - run: bun test

      - name: Compiled binary smoke test
        run: bun run smoke:compiled

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - run: bun scripts/package-release.ts

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/release/* --generate-notes

  verify-darwin:
    needs: release
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Install from the published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "cortex-$GITHUB_REF_NAME-darwin-arm64.tar.gz" \
            --pattern "checksums.txt" \
            --dir .
          grep " cortex-$GITHUB_REF_NAME-darwin-arm64.tar.gz\$" checksums.txt \
            | shasum -a 256 -c -
          tar -xzf "cortex-$GITHUB_REF_NAME-darwin-arm64.tar.gz"

      - name: Run the darwin binary
        run: |
          ./cortex --version
          repo=$(mktemp -d)
          cd "$repo"
          git init -b main
          git config user.email ci@example.com
          git config user.name CI
          git remote add origin git@github.com:acme/darwin-smoke.git
          mkdir src
          printf 'export class A { b(): boolean { return true } }\n' > src/a.ts
          git add .
          git commit -m init --no-gpg-sign
          "$GITHUB_WORKSPACE/cortex" init --yes
          "$GITHUB_WORKSPACE/cortex" index
